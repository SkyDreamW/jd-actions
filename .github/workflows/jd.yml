name: JD Sign

on:
  # 每天北京时间 07:15 触发（cron 是 UTC，07:15 UTC+8 = 前一天 23:15 UTC）
  # 避开凌晨 0 点的全网薅羊毛高峰，降低 Cookie 被风控概率
  schedule:
    - cron: '15 23 * * *'
  # 允许手动触发，方便调试
  workflow_dispatch:
  # 仓库被点亮 Star 时触发（方便首次测试）
  watch:
    types: [started]

# 配置环境变量（从 GitHub Secrets 读取，不要写死在代码里）
env:
  JD_COOKIE: ${{ secrets.JD_COOKIE }}
  JD_COOKIE2: ${{ secrets.JD_COOKIE2 }}
  JD_COOKIE3: ${{ secrets.JD_COOKIE3 }}
  PUSH_KEY: ${{ secrets.PUSH_KEY }}
  BARK_KEY: ${{ secrets.BARK_KEY }}
  # 风控优化：请求间随机延迟（毫秒），默认 5-15 秒
  JD_DELAY: '5000-15000'
  # 风控优化：禁用的接口代号（逗号分隔）。留空则全量签到。
  # 实测：京豆主签到(JDBean)/转盘(JDTurn)/现金红包(JDCash) 已被京东新签名拦截报错，
  # 禁用可避免反复 403/参数异常触发风控；保留钢镚(JRSteel)/魔方(JDCube) 等有真实响应的接口。
  JD_DISABLE: 'JDBean,JDTurn,JDCash'
  # 风控优化关键：请求 UA 必须与抓取 Cookie 的浏览器 UA 一致！
  # 你从 Mac Firefox 抓的 Cookie，这里就用 Firefox 桌面 UA。可设为 Secret JD_UA 覆盖。
  JD_UA: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:156.0) Gecko/20100101 Firefox/156.0'

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5 起 action 自身运行在 Node 24 上（v4 是 node20，已被 runner 移除）
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 这里的 node-version 是「项目运行时」，与 action 内部使用的 Node 版本无关。
          # Node 20 已于 2026-04 停止维护，后续建议升到 22 或 24。
          node-version: '20'

      - name: Install request dependency
        # NobyDa 脚本内部依赖 request 模块
        run: npm install request

      - name: Run JD sign script
        run: node jd_sign.js

      - name: Upload result artifact
        if: always()
        # 注意：v5 仍然声明 node20，必须直接升到 v6（v6 才是 node24）
        uses: actions/upload-artifact@v6
        with:
          name: sign-result
          path: |
            ./result.txt
            ./error.txt
          if-no-files-found: ignore
