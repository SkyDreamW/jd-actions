name: JD Sign

on:
  # 每天北京时间 07:15 触发（cron 是 UTC，07:15 UTC+8 = 前一天 23:15 UTC）
  # 避开凌晨 0 点的全网薅羊毛高峰，降低 Cookie 被风控概率
  schedule:
    - cron: '15 23 * * *'
  # 允许手动触发，方便调试
  workflow_dispatch:
  # 仓库被点亮 Star 时触发（方便首次测试）
  watch:
    types: [started]

# 同一时间只跑一个，避免定时任务和手动触发撞车
concurrency:
  group: jd-sign
  cancel-in-progress: false

# 配置环境变量（从 GitHub Secrets 读取，不要写死在代码里）
env:
  JD_COOKIE: ${{ secrets.JD_COOKIE }}
  JD_COOKIE2: ${{ secrets.JD_COOKIE2 }}
  JD_COOKIE3: ${{ secrets.JD_COOKIE3 }}
  PUSH_KEY: ${{ secrets.PUSH_KEY }}
  BARK_KEY: ${{ secrets.BARK_KEY }}
  # 脚本库目录，jd_sign.js 在这里执行各个脚本
  JD_SCRIPT_DIR: ${{ github.workspace }}/faker2

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5 起 action 自身运行在 Node 24 上（v4 是 node20，已被 runner 移除）
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 这是「项目运行时」，与 action 内部使用的 Node 版本无关
          node-version: '22'

      - name: 拉取脚本库（shufflewzc/faker2）
        # 不再自己维护签到脚本：faker2 上游持续更新（脚本内部版本号 2026xxxx），
        # 每天拉最新，京东改接口时上游先修，我们不用跟着改。
        run: git clone --depth 1 https://github.com/shufflewzc/faker2.git faker2

      - name: 安装脚本依赖
        # faker2 没有 package.json，这里显式锁版本，保证可复现。
        # got 必须锁 11.x：12 之后是纯 ESM，这些脚本用的是 require('got')。
        run: |
          cd faker2
          npm init -y > /dev/null 2>&1
          npm install --no-audit --no-fund \
            got@11.8.6 \
            tough-cookie@4.1.4 \
            https-proxy-agent \
            crypto-js \
            big-integer \
            axios \
            jsdom \
            dotenv \
            tunnel \
            global-agent \
            moment

      - name: Run JD sign script
        run: node jd_sign.js

      - name: Upload result artifact
        if: always()
        # 注意：v5 仍然声明 node20，必须直接升到 v6（v6 才是 node24）
        uses: actions/upload-artifact@v6
        with:
          name: sign-result
          path: |
            ./result.txt
            ./error.txt
          if-no-files-found: ignore
