version: 2

updates:
  # 自动跟进 GitHub Actions 的版本升级（如 Node 运行时换代）
  # 这样下次 runner 淘汰旧 Node 时，会有人替你提 PR，而不是等 workflow 变红。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm 依赖（脚本里会 npm install request）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
